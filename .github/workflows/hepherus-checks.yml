# T798/T799 — Hepherus connector-checks REUSABLE workflow.
#
# DESTINATION: Hepherus-Forge/checks/.github/workflows/hepherus-checks.yml (a PUBLIC repo Hepherus publishes).
# The customer's repo NEVER copies this file; it calls it, pinned by commit sha, via the thin caller
# workflow. The deterministic check logic lives in the committed, reviewable script scripts/build_payload.py
# in the SAME published repo (pinned together with this file).
#
# What it does (Coding_Connector_Scope.md §8 + §6.1; T797_Mocca_Reconciliation §3c Option 1):
#   - runs the §8 deterministic checks on each push to a non-default branch / each pull request
#   - extracts the §6.1 style-guide STRUCTURE when the declared styling file changed (ONLY that path)
#   - emits COUNTS + PATHS + the style-guide structure only — never code bodies, never .env values
#   - requests a GitHub Actions OIDC token (NO stored secret) and POSTs the payload, tied to the commit sha,
#     to the Hepherus ingest endpoint, which verifies the token server-side (connector_checks_oidc).
#
# T799 fix (real-run B-165): the earlier draft embedded `python - <<'PY'` heredocs whose bodies sat at
# column 0 inside a `run: |` block scalar — invalid YAML (the block scalar terminates on a dedented line),
# so the workflow failed at setup with 0 jobs. The two parse steps now use `python3 -c` one-liners; plus a
# self-checkout of this published repo (so build_payload.py is present) and a transparency echo of payload.json.

on:
  workflow_call:
    inputs:
      ingest_url:
        description: "Hepherus ingest endpoint (also the OIDC audience)."
        required: true
        type: string
      styling_path:
        description: "The ONE declared styling source file (§5.2). The ONLY path the style-guide step reads."
        required: false
        default: "styles/tokens.json"
        type: string
      settings_template_path:
        description: "The settings template listing the NAMES the code should read (names only, never .env)."
        required: false
        default: ".env.example"
        type: string

permissions:
  id-token: write      # required to mint the OIDC token — the no-stored-secret design depends on it
  contents: read       # read the repo to run the checks; never write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the head commit (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the pinned Hepherus checks script (at THIS workflow's own pinned sha)
        uses: actions/checkout@v4
        with:
          repository: Hepherus-Forge/checks
          # SECURITY: fetch build_payload.py at the SAME commit the caller pinned this reusable workflow to,
          # NOT a mutable branch. github.job_workflow_sha is the reusable workflow's own commit sha in a
          # reusable call (the sha in the OIDC job_workflow_ref our ingest verifies); it falls back to
          # github.sha when this workflow is run directly (self-test). This makes the pinned sha fully
          # determine what executes in the customer's CI — the @main fetch was a supply-chain gap.
          ref: ${{ github.job_workflow_sha || github.sha }}
          path: .hepherus-checks

      - name: Set up Node (tests + npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (payload assembly)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine the base commit and the changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only "$BASE" "${{ github.sha }}" > changed_files.txt || true

      - name: Run the project's tests (run/passed/failed + failing names)
        shell: bash
        run: |
          set -euo pipefail
          echo '{"run":0,"passed":0,"failed":0,"failing":[]}' > tests.json
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund || true
            npx --yes jest --json --outputFile=jest.json --ci || true
            if [ -f jest.json ]; then
              python3 -c 'import json; d=json.load(open("jest.json")); f=[t["fullName"] for r in d.get("testResults",[]) for t in r.get("assertionResults",[]) if t.get("status")=="failed"]; json.dump({"run":d.get("numTotalTests",0),"passed":d.get("numPassedTests",0),"failed":d.get("numFailedTests",0),"failing":f[:200]}, open("tests.json","w"))'
            fi
          fi

      - name: Audit packages by severity
        shell: bash
        run: |
          set -euo pipefail
          echo '{"critical":0,"high":0,"moderate":0,"low":0}' > vuln.json
          if [ -f package-lock.json ]; then
            npm audit --json > audit.json 2>/dev/null || true
            if [ -f audit.json ]; then
              python3 -c 'import json,os; v=(json.load(open("audit.json")).get("metadata",{}).get("vulnerabilities",{}) if os.path.exists("audit.json") else {}); json.dump({k:int(v.get(k,0)) for k in ("critical","high","moderate","low")}, open("vuln.json","w"))'
            fi
          fi

      - name: Assemble the §8 + §6.1 payload (counts + paths + style structure only)
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ github.workspace }}/.hepherus-checks/scripts/build_payload.py" \
            --changed changed_files.txt \
            --styling-path "${{ inputs.styling_path }}" \
            --settings-template "${{ inputs.settings_template_path }}" \
            --tests tests.json \
            --vuln vuln.json \
            --commit-sha "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --repository-id "${{ github.repository_id }}" \
            --out payload.json

      - name: Print the assembled payload (transparency; counts/paths/structure only, never values)
        shell: bash
        run: |
          echo "----- payload.json (what will be POSTed) -----"
          cat payload.json || echo "(payload.json missing)"
          echo ""
          echo "----- end payload -----"

      - name: Request the OIDC token and POST the result to Hepherus
        shell: bash
        env:
          INGEST_URL: ${{ inputs.ingest_url }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OIDC="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$INGEST_URL" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["value"])')"
          BODY="$(python3 -c 'import json, sys; print(json.dumps({"commit_sha": sys.argv[1], "payload": json.load(open("payload.json"))}))' "$HEAD_SHA")"
          echo "POSTing to $INGEST_URL (response below):"
          curl -sS -o response.txt -w "HTTP %{http_code}\n" -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data "$BODY" || true
          echo "----- ingest response body -----"
          cat response.txt || true
          echo ""
          echo "----- end ingest response -----"
