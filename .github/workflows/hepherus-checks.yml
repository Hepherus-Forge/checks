# T798/T799 — Hepherus connector-checks REUSABLE workflow.
#
# DESTINATION: Hepherus-Forge/checks/.github/workflows/hepherus-checks.yml (a PUBLIC repo Hepherus publishes).
# The customer's repo NEVER copies this file; it calls it, pinned by commit sha, via the thin caller
# workflow. The deterministic check logic lives in the committed, reviewable script scripts/build_payload.py
# in the SAME published repo (pinned together with this file).
#
# What it does (Coding_Connector_Scope.md §8 + §6.1; T797_Mocca_Reconciliation §3c Option 1):
#   - runs the §8 deterministic checks on each push to a non-default branch / each pull request
#   - extracts the §6.1 style-guide STRUCTURE when the declared styling file changed (ONLY that path)
#   - emits COUNTS + PATHS + the style-guide structure only — never code bodies, never .env values
#   - requests a GitHub Actions OIDC token (NO stored secret) and POSTs the payload, tied to the commit sha,
#     to the Hepherus ingest endpoint, which verifies the token server-side (connector_checks_oidc).
#
# T799 fix (real-run B-165): the earlier draft embedded `python - <<'PY'` heredocs whose bodies sat at
# column 0 inside a `run: |` block scalar — invalid YAML (the block scalar terminates on a dedented line),
# so the workflow failed at setup with 0 jobs. The two parse steps now use `python3 -c` one-liners; plus a
# self-checkout of this published repo (so build_payload.py is present) and a transparency echo of payload.json.

on:
  workflow_call:
    inputs:
      ingest_url:
        description: "Hepherus ingest endpoint (also the OIDC audience)."
        required: true
        type: string
      styling_path:
        description: "The ONE declared styling source file (§5.2). The ONLY path the style-guide step reads."
        required: false
        default: "styles/tokens.json"
        type: string
      settings_template_path:
        description: "The settings template listing the NAMES the code should read (names only, never .env)."
        required: false
        default: ".env.example"
        type: string
      binding_code:
        description: "S12 R5 - the per-project binding code Hepherus issued at setup (an identifier, not a credential). Sent with the OIDC token; binds the project on its first check."
        required: false
        default: ""
        type: string

permissions:
  id-token: write      # required to mint the OIDC token — the no-stored-secret design depends on it
  contents: read       # read the repo to run the checks; never write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the head commit (full history for the diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned to a commit sha)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve THIS workflow's own commit sha (fail closed — never a mutable ref)
        id: selfsha
        shell: bash
        env:
          # job.workflow_sha = "the commit SHA of the workflow file that defines the current job"; in a
          # REUSABLE workflow it is THIS (checks) repo's commit, not the caller's. (github.job_workflow_sha
          # is NOT a documented context — the earlier use of it was a bug that always fell back.)
          SELF_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$SELF_SHA" ]; then
            echo "::error::job.workflow_sha is empty — refusing to fetch build_payload.py from a mutable ref"
            exit 1
          fi
          echo "sha=$SELF_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned Hepherus checks script (at THIS workflow's own commit sha)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned to a commit sha)
        with:
          repository: Hepherus-Forge/checks
          # SECURITY: fetch build_payload.py at the SAME commit the caller pinned this reusable workflow to
          # (job.workflow_sha), NOT a mutable branch — so the pinned sha fully determines what runs in the
          # customer's CI. Fail-closed above if that sha is ever unavailable (never falls back to main/caller).
          ref: ${{ steps.selfsha.outputs.sha }}
          path: .hepherus-checks
          persist-credentials: false

      - name: Set up Node (tests + npm audit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0 (pinned to a commit sha)
        with:
          node-version: "24"

      - name: Set up Python (payload assembly)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned to a commit sha)
        with:
          python-version: "3.12"

      - name: Determine the base commit and the changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only "$BASE" "${{ github.sha }}" > changed_files.txt || true
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Audit packages and refuse any audit suppression (F22/F25)
        shell: bash
        timeout-minutes: 10
        # suppression_gate.py audits a CLEAN COPY of package.json and the lockfile (no .npmrc of the project, the public
        # registry, every dependency group) and fails the check on an audit that could not be read, on packages without a
        # lockfile, and on any tracked file or key that silences an audit tool.
        run: |
          set -euo pipefail
          python3 "${{ github.workspace }}/.hepherus-checks/scripts/suppression_gate.py" --vuln-out vuln.json --out suppression.json

      - name: Run the project's own test script (run/passed/failed + failing names)
        shell: bash
        timeout-minutes: 15
        # F24: package.json's declared "test" script, whatever runner it uses. Test files with no readable result or 0 tests
        # run FAIL the check; a repository without test files says "no tests" and is never reported as tested.
        # The project's code runs in a THROWAWAY CONTAINER (the pinned Node image) that gets the tracked files on its standard
        # input and nothing else: no workspace, no token, no environment of the runner. Only its own JSON result comes out,
        # and it is read as untrusted text. No container, no readable result: the check fails.
        run: |
          set -euo pipefail
          CHECKS="${{ github.workspace }}/.hepherus-checks/scripts"
          OUT="$RUNNER_TEMP/hepherus_tests"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          EXIT=-1
          CMD="$(python3 "$CHECKS/read_tests.py" plan)"
          if [ -n "$CMD" ]; then
            IMAGE=""
            for ref in node@sha256:873f586f3794f52281bd039bf02c048a0be08fde619338f9941bad1eb6b34530 public.ecr.aws/docker/library/node@sha256:873f586f3794f52281bd039bf02c048a0be08fde619338f9941bad1eb6b34530; do
              if docker pull -q "$ref"; then IMAGE="$ref"; break; fi
            done
            if [ -z "$IMAGE" ]; then
              echo "the Node image could not be fetched: the tests did not run"
            else
              set +e
              git archive HEAD | timeout -k 10 600 docker run -i --name hepherus_tests --user node --cap-drop ALL --security-opt no-new-privileges --log-driver none -e CI=true -e HUSKY=0 -e CMD="$CMD" "$IMAGE" bash -c 'mkdir /home/node/app && cd /home/node/app && tar -xf - && { npm ci --no-audit --no-fund < /dev/null || exit 97; } && rm -f jest.json && bash -c "$CMD" < /dev/null' > "$OUT/test.log" 2>&1
              EXIT=$?
              set -e
              if [ "$EXIT" = "97" ]; then EXIT=-1; echo "npm ci failed: the tests did not run"; fi
              docker cp hepherus_tests:/home/node/app/jest.json "$OUT/jest.json" || echo "(no JSON result)"
              docker rm -f hepherus_tests
            fi
          fi
          python3 "$CHECKS/read_tests.py" read --exit "$EXIT" --result "$OUT/jest.json" --log "$OUT/test.log"

      - name: Modular gates (Mocca Build Guidelines v1.3 §6.4 — one door per shared job, 800-line limit, no cross-module internals)
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ github.workspace }}/.hepherus-checks/scripts/module_gates.py"             --base "${{ steps.diff.outputs.base }}"             --styling-path "${{ inputs.styling_path }}"             --out modular.json

      - name: Assemble the §8 + §6.1 payload (counts + paths + style structure only)
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ github.workspace }}/.hepherus-checks/scripts/build_payload.py" \
            --changed changed_files.txt \
            --styling-path "${{ inputs.styling_path }}" \
            --settings-template "${{ inputs.settings_template_path }}" \
            --tests tests.json \
            --vuln vuln.json             --modular modular.json             --suppression suppression.json \
            --commit-sha "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --repository-id "${{ github.repository_id }}" \
            --out payload.json

      - name: Print the assembled payload (transparency; counts/paths/structure only, never values)
        shell: bash
        run: |
          echo "----- payload.json (what will be POSTed) -----"
          cat payload.json || echo "(payload.json missing)"
          echo ""
          echo "----- end payload -----"

      - name: Request the OIDC token and POST the result to Hepherus
        shell: bash
        env:
          INGEST_URL: ${{ inputs.ingest_url }}
          HEAD_SHA: ${{ github.sha }}
          BINDING_CODE: ${{ inputs.binding_code }}
        run: |
          set -euo pipefail
          OIDC="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$INGEST_URL" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["value"])')"
          BODY="$(python3 -c 'import json, sys; print(json.dumps({"commit_sha": sys.argv[1], "binding_code": sys.argv[2], "payload": json.load(open("payload.json"))}))' "$HEAD_SHA" "$BINDING_CODE")"
          echo "POSTing to $INGEST_URL (response below):"
          curl -sS -o response.txt -w "HTTP %{http_code}\n" -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data "$BODY" || true
          echo "----- ingest response body -----"
          cat response.txt || true
          echo ""
          echo "----- end ingest response -----"

      # v1.3 (D-2747): the job itself FAILS on a failing result, so GitHub's REQUIRED status check (§6.6) refuses
      # the merge. Before this step the job always succeeded (the result only blocked Mocca's "done" server-side).
      - name: Fail the check when the result is "fail" (blocks the merge)
        shell: bash
        run: |
          python3 -c 'import json,sys; p=json.load(open("payload.json")); m=p.get("modular",{}); print("conclusion:", p.get("conclusion"), "| modular:", m.get("status"), m.get("reason","")); sys.exit(1 if p.get("conclusion")=="fail" else 0)'
